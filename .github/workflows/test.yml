name: CI

# ---------------------------------------------------------------------------
# APK de release assinado
# ---------------------------------------------------------------------------
# O APK publicado é o build de RELEASE, assinado sempre com a mesma chave. É isso
# que permite instalar uma versão nova por cima da anterior: o Android recusa a
# atualização ("pacote já existe") quando a assinatura muda entre as versões — e o
# keystore de debug muda a cada execução do GitHub Actions.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    arquivo do keystore codificado em base64 (uma linha)
#   ANDROID_KEYSTORE_PASSWORD  senha do keystore
#   ANDROID_KEY_ALIAS          alias da chave
#   ANDROID_KEY_PASSWORD       senha da chave
#
# NUNCA troque nem perca essa chave: com outra chave o app precisa ser desinstalado
# antes de instalar a nova versão. Guarde uma cópia do keystore e das senhas.
# ---------------------------------------------------------------------------

on:
  push:
    branches: ['main', 'dev']
    paths-ignore:
      - 'downloads/**'
      - '*.md'
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: 'Publishes the signed release Anisync.apk to a GitHub Release after CI and Android build succeed'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      # Runs on GitHub's server, outside of any local Husky hook — so even if
      # someone committed or pushed with --no-verify, this step still scans the
      # repository history and fails the workflow if any secret is detected.
      - name: Scan for leaked secrets (gitleaks)
        run: npx gitleaks detect --redact -v

      - name: Check Types
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Web Bundle
        run: npm run build

  build-apk:
    name: Build Anisync APK (release)
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Nenhum secret é exposto nos passos de npm: os scripts de instalação das
      # dependências rodam sem acesso à chave de assinatura.
      - name: Install npm dependencies
        run: npm install

      - name: Build web bundle and sync Capacitor Android
        env:
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: npm run apk:sync

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret ausente::O secret $name não está configurado. Veja o cabeçalho de .github/workflows/test.yml."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Sem a chave de assinatura não dá para gerar o APK de release instalável. Configure os secrets e rode de novo."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          # Falha cedo e com mensagem clara se o alias/senha não baterem com o keystore.
          keytool -list -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            # versionCode precisa sempre crescer para o Android aceitar como atualização.
            # Minutos desde 1970: crescente em qualquer workflow e nunca reinicia.
            echo "APP_VERSION_CODE=$(( $(date +%s) / 60 ))"
            echo "APP_VERSION_NAME=1.0.${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify release APK (signed, not debuggable)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package:"
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::O APK gerado é debuggable. O release deve ser o build normal (release), não o debug."
            exit 1
          fi

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/release/app-release.apk Anisync.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Anisync-apk
          path: Anisync.apk
          retention-days: 30

  publish-release:
    name: Publish APK Release
    needs: build-apk
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    # Least privilege: only this job gets a write token. The top-level
    # `permissions: contents: read` also applies when this file is called via
    # workflow_call (a called workflow can only restrict the caller's token, never
    # elevate it), so write access has to be granted per job. This job runs no
    # project code (no npm / Gradle), so a compromised dependency can't reach it.
    permissions:
      contents: write

    steps:
      - name: Checkout git history for changelog
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: Anisync-apk

      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          BASE_TAG="v1.0.${{ github.run_number }}"
          TAG="$BASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${BASE_TAG}-$(date -u +%Y%m%d%H%M%S)"
          fi

          # Versões antigas publicavam TopAnimes-debug.apk no release legado; garante limpeza sem apagar APKs assinados anteriores.
          gh release delete-asset "latest-apk" TopAnimes-debug.apk --yes 2>/dev/null || true

          format_commits_section() {
            local range="$1"
            local feats=""
            local fixes=""
            local others=""
            while IFS=$'\x1f' read -r hash subject; do
              [ -z "$hash" ] && continue
              case "$subject" in
                "chore(release): update CHANGELOG.md"*|"chore: update CHANGELOG.md"*) continue ;;
              esac
              local clean
              clean="$(printf '%s' "$subject" | sed -E 's/^[a-zA-Z]+(\([^)]+\))?!?:[[:space:]]*//')"
              clean="$(printf '%s' "$clean" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
              local line="- ${clean} (\`${hash}\`)"
              case "$subject" in
                feat:*|feat\(*\):*|feat!:*|feat\(*\)!:*)
                  feats="${feats}${line}"$'\n'
                  ;;
                fix:*|fix\(*\):*|fix!:*|fix\(*\)!:*)
                  fixes="${fixes}${line}"$'\n'
                  ;;
                *)
                  others="${others}${line}"$'\n'
                  ;;
              esac
            done < <(git log --no-merges --format='%h%x1f%s' "$range")

            if [ -n "$feats" ]; then
              echo "### Novidades"
              printf '%s\n' "$feats"
            fi
            if [ -n "$fixes" ]; then
              echo "### Correções"
              printf '%s\n' "$fixes"
            fi
            if [ -n "$others" ]; then
              echo "### Melhorias e Manutenção"
              printf '%s\n' "$others"
            fi
            if [ -z "$feats" ] && [ -z "$fixes" ] && [ -z "$others" ]; then
              echo "- Build de manutenção sem novos commits desde a versão anterior."
              echo ""
            fi
          }

          PREV_TAG="$(git tag --list 'v*' --merged "$TARGET_SHA" --sort=-v:refname | grep -vxF "$TAG" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMIT_RANGE="${PREV_TAG}..${TARGET_SHA}"
          else
            COMMIT_RANGE="$TARGET_SHA"
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Changelog"
            echo ""
            format_commits_section "$COMMIT_RANGE"
            if [ -n "$PREV_TAG" ]; then
              echo "**Comparação completa:** https://github.com/${GH_REPO}/compare/${PREV_TAG}...${TAG}"
              echo ""
            fi
            echo "---"
            echo ""
            echo "Build automático (release assinado) gerado após validação de segurança, lint, testes unitários e compilação Android (${TARGET_SHA})."
            echo ""
            echo 'Instalação: baixe Anisync.apk e instale por cima da versão anterior. Se aparecer "pacote já existe" / "conflita com um pacote existente", desinstale o app UMA vez (se a versão anterior foi assinada com outra chave) e instale de novo; as próximas atualizações instalam por cima normalmente.'
          } > "$NOTES_FILE"

          gh release create "$TAG" Anisync.apk \
            --target "$TARGET_SHA" \
            --title "Anisync $TAG" \
            --notes-file "$NOTES_FILE"

          # Regenera CHANGELOG.md automaticamente a partir das tags e commits do repositório.
          {
            echo "# Changelog"
            echo ""
            echo "Todas as alterações relevantes do **Anisync** são geradas automaticamente a partir dos commits de cada release."
            echo ""
            echo "## [$TAG] — $(date -u +%Y-%m-%d)"
            echo ""
            format_commits_section "$COMMIT_RANGE"

            TAGS=()
            while IFS= read -r t; do
              [ -n "$t" ] && [ "$t" != "$TAG" ] && TAGS+=("$t")
            done < <(git tag --list 'v*' --merged "$TARGET_SHA" --sort=-v:refname)

            for i in "${!TAGS[@]}"; do
              cur="${TAGS[$i]}"
              cur_date="$(git log -1 --format='%cs' "$cur")"
              next_idx=$((i + 1))
              if [ "$next_idx" -lt "${#TAGS[@]}" ]; then
                prev="${TAGS[$next_idx]}"
                rng="${prev}..${cur}"
              elif git rev-parse --verify "latest-apk^{commit}" >/dev/null 2>&1; then
                rng="latest-apk..${cur}"
              else
                rng="$cur"
              fi
              echo "## [$cur] — $cur_date"
              echo ""
              format_commits_section "$rng"
            done

            if git rev-parse --verify "latest-apk^{commit}" >/dev/null 2>&1; then
              legacy_date="$(git log -1 --format='%cs' latest-apk)"
              echo "## [latest-apk] — $legacy_date"
              echo ""
              format_commits_section "latest-apk"
            fi
          } > CHANGELOG.md

          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit --no-verify -m "chore(release): update CHANGELOG.md for $TAG [skip ci]"
            git push origin "HEAD:${TARGET_BRANCH}" || echo "::warning::Não foi possível enviar CHANGELOG.md automaticamente para ${TARGET_BRANCH}."
          fi
