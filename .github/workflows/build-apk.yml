name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'downloads/**'
      - '*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TopAnimes APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests
        run: npx --yes tsx --test src/lib/*.test.ts

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build web bundle and sync Capacitor Android
        run: npm run apk:sync

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TopAnimes-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopAnimes-debug-apk
          path: TopAnimes-debug.apk
          retention-days: 30
