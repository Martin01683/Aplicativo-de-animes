apply plugin: 'com.android.application'

// -----------------------------------------------------------------------------
// Assinatura e versão do APK de release
// -----------------------------------------------------------------------------
// O Android só instala uma atualização "por cima" de um app já instalado quando o
// APK novo é assinado com a MESMA chave do APK antigo e tem versionCode >= ao
// instalado. Se a chave muda a cada build (como o keystore de DEBUG, que é recriado
// em cada runner novo do GitHub Actions), a instalação falha com "pacote já existe /
// conflita com um pacote existente".
//
// Por isso o release é assinado com uma chave FIXA, informada por variáveis de
// ambiente (no CI elas vêm dos GitHub Secrets; veja .github/workflows/test.yml).
// Nunca coloque senhas nem o arquivo de keystore dentro do repositório.
//
//   ANDROID_KEYSTORE_PATH      caminho do arquivo de keystore (.keystore / .jks)
//   ANDROID_KEYSTORE_PASSWORD  senha do keystore
//   ANDROID_KEY_ALIAS          alias da chave dentro do keystore
//   ANDROID_KEY_PASSWORD       senha da chave
//   APP_VERSION_CODE           inteiro que sempre cresce a cada build (padrão: 1)
//   APP_VERSION_NAME           versão exibida ao usuário (padrão: "1.0")
//
// Sem as variáveis de keystore, `assembleRelease` gera um APK NÃO assinado
// (app-release-unsigned.apk), que o Android se recusa a instalar.
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
if (releaseKeystorePath && !file(releaseKeystorePath).exists()) {
    throw new GradleException("ANDROID_KEYSTORE_PATH aponta para um arquivo que não existe: ${releaseKeystorePath}")
}
def hasReleaseKeystore = releaseKeystorePath != null && !releaseKeystorePath.trim().isEmpty()
def appVersionCode = (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()
def appVersionName = System.getenv('APP_VERSION_NAME') ?: '1.0'

android {
    namespace = "com.topanimes.player"
    compileSdk = rootProject.ext.compileSdkVersion
    def envNdkHome = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT')
    if (envNdkHome) {
        def ndkDir = file(envNdkHome)
        if (ndkDir.isDirectory() && ndkDir.parentFile?.name == 'ndk' && ndkDir.name ==~ /^\d+\.\d+\.\d+$/) {
            ndkVersion = ndkDir.name
        }
    }
    defaultConfig {
        applicationId "com.topanimes.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf2b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/*.zip.so'
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.videolan.android:libvlc-all:3.7.8"
    implementation("io.github.junkfood02.youtubedl-android:library:0.18.1") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
