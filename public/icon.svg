    stroke-linecap="round"
  />
  <!-- Inner synchronized orange arcs -->
  <path
    d="M 152 192 A 122 122 0 0 1 374 286"
    fill="none"
    stroke="url(#play)"
    stroke-width="22"
    stroke-linecap="round"
  />
  <path
    d="M 360 320 A 122 122 0 0 1 138 226"
    fill="none"
    stroke="url(#play)"
    stroke-width="22"
    stroke-linecap="round"
  />
  <!-- Central rounded hollow Play triangle -->
  <path
    d="M 218 194 L 314 256 L 218 318 Z"
    fill="none"
    stroke="url(#play)"
    stroke-width="34"
